services:
  - type: web
    name: arbitraggio
    runtime: python
    plan: free
    buildCommand: cp deploy/config.production.json config.json && pip install -r requirements.txt
    startCommand: python run_all.py
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SCAN_PAGES
        value: "10"
      - key: PREDICT_API_KEY
        sync: false
      - key: OPINION_API_KEY
        sync: false
      - key: LIMITLESS_API_KEY
        sync: false
