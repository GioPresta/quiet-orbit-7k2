name: collect

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PREDICT_API_KEY: ${{ secrets.PREDICT_API_KEY }}
      OPINION_API_KEY: ${{ secrets.OPINION_API_KEY }}
      LIMITLESS_API_KEY: ${{ secrets.LIMITLESS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Runtime config
        run: cp deploy/config.production.json config.json
      - name: Seed liquidity cache
        run: mkdir -p output && cp deploy/liquidity-cache.json output/liquidity-cache.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -r requirements.txt
      - name: Restore published history
        run: |
          mkdir -p output
          for file in opportunity-ledger.json opportunity-tracking.jsonl opportunities-legs.csv opportunities-sizes.csv tracking-history.jsonl tracking.json; do
            if [ -s "docs/data/$file" ]; then
              cp "docs/data/$file" "output/$file"
            fi
          done
      - name: Scan once
        run: python -m arbitraggio --budget 100 --budgets 50 100 --pages 50 --once --reuse-catalog --output output
      - name: Track wallet positions once
        run: python -m arbitraggio.tracking --once --output output
      - name: Build static page
        run: python scripts/publish_snapshot.py --output output --docs docs
      - name: Commit published snapshot
        run: |
          git config user.name "arbitraggio-bot"
          git config user.email "arbitraggio-bot@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "Nessun cambiamento"
          else
            git commit -m "snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            for attempt in 1 2 3; do
              git fetch origin main
              if git rebase -X ours origin/main && git push origin main; then
                exit 0
              fi
              git rebase --abort >/dev/null 2>&1 || true
              sleep 3
            done
            exit 1
          fi
